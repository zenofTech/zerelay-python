[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zerelay"
version = "0.1.0"
description = "Official Python SDK for the Zerelay email and SMS API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []
keywords = ["zerelay", "email", "sms", "transactional-email", "smtp", "nigeria", "webhooks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://zerelay.com"
Documentation = "https://zerelay.com/developer/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zerelay = ["py.typed"]
